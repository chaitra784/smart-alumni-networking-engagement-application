<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up - Alums_kin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+French+Canon+SC&family=Inter:wght@400;500;600;700;800&family=Lateef:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="separate-page">
    <main class="app">
      <section class="phone">
        <article class="screen signup-screen active">
          <header class="brand-bar">
            <h1>Alums_kin</h1>
          </header>
          <button class="menu-btn" aria-label="menu">⋯</button>
          <div class="form-card wide">
            <label>enter the Access ID you received on your registered email..</label>
            <input type="text" placeholder="Access ID" />
          </div>
          <div class="form-card">
            <label>set a strong password...</label>
            <input type="password" placeholder="Strong password" />
          </div>
          <a href="home.html"><button class="btn btn-primary">Sign in</button></a>
        </article>
      </section>
    </main>
  </body>
</html>
