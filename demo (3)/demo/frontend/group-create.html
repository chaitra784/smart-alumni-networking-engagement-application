<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create</title>
    <link rel="stylesheet" href="group-create.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="create-container">
        <header>
            <i class="fa-solid fa-arrow-left" onclick="history.back()"></i>
            <h1 class="gold-title">Create...</h1>
            <i class="fa-regular fa-pen-to-square"></i>
            <i class="fa-solid fa-ellipsis-vertical"></i>
        </header>

        <div class="action-list">
            <div class="action-item">
                <span>add announcements</span>
                <i class="fa-solid fa-table-cells-large"></i>
            </div>
            <div class="action-item">
                <span>create a group...</span>
                <i class="fa-solid fa-users"></i>
            </div>
            <div class="action-item">
                <span>create a community...</span>
                <i class="fa-solid fa-users-rectangle"></i>
            </div>
        </div>

        <div class="contacts-list">
            <div class="contact-row">
                <img src="https://picsum.photos/id/20/40">
                <div class="info">
                    <h4>Sunina</h4>
                    <span>sunaina..0_0</span>
                </div>
                <img src="https://picsum.photos/id/20/15" class="small-tag">
            </div>
            <div class="contact-row">
                <img src="https://picsum.photos/id/21/40">
                <div class="info">
                    <h4>Tara</h4>
                    <span>tara...0_0</span>
                </div>
                <img src="https://picsum.photos/id/21/15" class="small-tag">
            </div>
        </div>
    </div>
</body>
</html>
