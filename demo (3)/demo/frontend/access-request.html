<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Access Request - Alums_kin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IM+Fell+French+Canon+SC&family=Inter:wght@400;500;600;700;800&family=Lateef:wght@500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="separate-page">
    <main class="app">
      <section class="phone">
        <article class="screen access-screen active">
          <header class="brand-bar">
            <h1>Alums_kin</h1>
          </header>
          <button class="menu-btn" aria-label="menu">⋯</button>
          <div class="form-card">
            <label>Enter your registered email ID...</label>
            <input type="email" placeholder="name@email.com" />
          </div>
          <div class="form-card dark">
            <label>select your role...</label>
            <select>
              <option>Alumni</option>
              <option>Student</option>
              <option>Faculty</option>
            </select>
          </div>
          <button class="btn btn-success">Request an Access ID</button>
          <p class="hint">check the access ID you received on your registered email...</p>
          <a href="./login.html" class="btn btn-ghost">Go back</a>
        </article>
      </section>
    </main>
  </body>
</html>
