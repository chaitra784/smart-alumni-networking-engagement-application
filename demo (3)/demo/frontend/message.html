<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Sunina</title>
    <link rel="stylesheet" href="message.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="chat-container">
        <header class="chat-header">
            <i class="fa-solid fa-arrow-left" onclick="history.back()"></i>
            <img src="https://picsum.photos/id/10/50" class="profile-pic">
            <div class="user-meta">
                <h3>Sunina</h3>
                <span>sunaina..0_0</span>
            </div>
            <div class="header-actions">
                <i class="fa-solid fa-circle-nodes community-icon"></i>
                <i class="fa-solid fa-ellipsis-vertical"></i>
            </div>
        </header>

        <main class="chat-content">
            <div class="bubble received"></div>
            <div class="bubble sent-wrapper">
                <img src="https://picsum.photos/id/10/20" class="mini-avatar">
                <div class="bubble sent"></div>
            </div>
        </main>

        <footer class="chat-input-area">
            <div class="input-wrapper">
                <i class="fa-solid fa-table-cells-large"></i>
                <input type="text" placeholder="type.. here">
                <i class="fa-solid fa-link"></i>
                <i class="fa-solid fa-camera"></i>
            </div>
        </footer>
    </div>
</body>
</html>
